<svg xmlns="http://www.w3.org/2000/svg" width="820" height="352" viewBox="0 0 820 352" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hard with one ability removed, against full hard</title>
<desc id="d">Win share of the reduced bot, 800 rounds each. Below 50% means the ability adds strength.</desc>
<rect width="820" height="352" rx="12" fill="#fcfcfb"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#0b0b0b">Hard with one ability removed, against full hard</text>
<text x="24" y="56" font-size="13" fill="#52514e">Win share of the reduced bot, 800 rounds each. Below 50% means the ability adds strength.</text>
<line x1="250" x2="250" y1="90" y2="306" stroke="#e6e5e0" stroke-width="1"/>
<text x="250" y="324" font-size="12" fill="#52514e" text-anchor="middle">0%</text>
<line x1="342.5" x2="342.5" y1="90" y2="306" stroke="#e6e5e0" stroke-width="1"/>
<text x="342.5" y="324" font-size="12" fill="#52514e" text-anchor="middle">25%</text>
<line x1="435" x2="435" y1="90" y2="306" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 4"/>
<text x="435" y="324" font-size="12" fill="#52514e" text-anchor="middle">50%</text>
<line x1="527.5" x2="527.5" y1="90" y2="306" stroke="#e6e5e0" stroke-width="1"/>
<text x="527.5" y="324" font-size="12" fill="#52514e" text-anchor="middle">75%</text>
<line x1="620" x2="620" y1="90" y2="306" stroke="#e6e5e0" stroke-width="1"/>
<text x="620" y="324" font-size="12" fill="#52514e" text-anchor="middle">100%</text>
<text x="435" y="84" font-size="12" fill="#52514e" text-anchor="middle">even split</text>
<text x="24" y="100" font-size="13" font-weight="600" fill="#52514e">Ability removed</text>
<text x="24" y="133" font-size="14" fill="#0b0b0b">Memory of two cards</text>
<text x="24" y="150" font-size="12" fill="#52514e">remembers only its two latest cards</text>
<line x1="377.7" x2="400.9" y1="135" y2="135" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="377.7" x2="377.7" y1="129" y2="141" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="400.9" x2="400.9" y1="129" y2="141" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="389.3" cy="135" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="638" y="140" font-size="13" fill="#0b0b0b">37.6% <tspan fill="#52514e">(34.5% to 40.8%)</tspan></text>
<text x="24" y="179" font-size="14" fill="#0b0b0b">No card counting</text>
<text x="24" y="196" font-size="12" fill="#52514e">treats every unseen card as a full deck draw</text>
<line x1="414.3" x2="434.0" y1="181" y2="181" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="414.3" x2="414.3" y1="175" y2="187" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="434.0" x2="434.0" y1="175" y2="187" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="424.1" cy="181" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="638" y="186" font-size="13" fill="#0b0b0b">47.1% <tspan fill="#52514e">(44.4% to 49.7%)</tspan></text>
<text x="24" y="225" font-size="14" fill="#0b0b0b">No inference from keeps</text>
<text x="24" y="242" font-size="12" fill="#52514e">ignores opponents keeping or pushing a draw</text>
<line x1="404.1" x2="426.1" y1="227" y2="227" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="404.1" x2="404.1" y1="221" y2="233" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="426.1" x2="426.1" y1="221" y2="233" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="415.1" cy="227" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="638" y="232" font-size="13" fill="#0b0b0b">44.6% <tspan fill="#52514e">(41.6% to 47.6%)</tspan></text>
<text x="24" y="271" font-size="14" fill="#0b0b0b">No Cambio gate</text>
<text x="24" y="288" font-size="12" fill="#52514e">calls on any estimated lead</text>
<line x1="403.5" x2="425.4" y1="273" y2="273" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="403.5" x2="403.5" y1="267" y2="279" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<line x1="425.4" x2="425.4" y1="267" y2="279" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="414.4" cy="273" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="638" y="278" font-size="13" fill="#0b0b0b">44.4% <tspan fill="#52514e">(41.5% to 47.4%)</tspan></text>
</svg>
