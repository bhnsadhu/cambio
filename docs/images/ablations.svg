<line x1="430.6" x2="430.6" y1="273" y2="285" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="420.0" cy="279" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="638" y="284" font-size="13" fill="#0b0b0b">44.4% <tspan fill="#52514e">(41.5% to 47.4%)</tspan></text>
</svg>
