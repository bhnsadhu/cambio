<svg xmlns="http://www.w3.org/2000/svg" width="820" height="486" viewBox="0 0 820 486" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Win share by matchup, with 95% intervals</title>
