<text x="435" y="84" font-size="12" fill="#52514e" text-anchor="middle">even split</text>
<text x="24" y="100" font-size="13" font-weight="600" fill="#52514e">Levels</text>
<text x="24" y="133" font-size="14" fill="#0b0b0b">Hard vs medium</text>
<text x="24" y="150" font-size="12" fill="#52514e">share won by hard</text>
