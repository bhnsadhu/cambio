<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Do Cambio calls win as often as the bots believe?</title>
<desc id="d">Calls by shipped bots and by hard with only the gate removed, grouped by the caller's win belief. 95% Wilson intervals.</desc>
<rect width="820" height="560" rx="12" fill="#fcfcfb"/>
